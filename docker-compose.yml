services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - ./model_weights:/app/model_weights:ro
      - history_data:/app/data

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      # Read by Next.js API routes on the server, never by the browser.
      - BACKEND_URL=http://backend:8000
    depends_on: [backend]

volumes:
  history_data:
